name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Gradle wrapper executable
        working-directory: apps/api
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build & Test
        working-directory: apps/api
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: test-secret-key-at-least-64-bytes-long-for-hs512-algorithm-use-only-ci
          WATSONX_MOCK_MODE: true

  frontend:
    name: Frontend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Type-check
        working-directory: apps/web
        run: npm run type-check
      - name: Type-check tests
        working-directory: apps/web
        run: npm run type-check:tests
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm test

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t consulting-sim-api:${{ github.sha }} apps/api
      - name: Build Web image
        run: docker build -t consulting-sim-web:${{ github.sha }} apps/web
