server {
    # ${PORT} is substituted at container start by envsubst (see Dockerfile CMD).
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # The SPA entry must be revalidated after a release. An old cached index
    # cannot safely reference a removed hashed JavaScript chunk.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Never fall back to HTML for a missing module. Returning index.html here
    # causes browser MIME errors and a blank lazy-loaded route after a deploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React SPA routes may resolve to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
