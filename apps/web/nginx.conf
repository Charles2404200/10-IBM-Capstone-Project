server {
    # ${PORT} is substituted at container start by envsubst (see Dockerfile CMD).
    # Falls back to 3000 for local docker-compose where PORT is not injected.
    listen ${PORT:-3000};
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — return index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
