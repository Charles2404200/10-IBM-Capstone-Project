spring:
  application:
    name: consulting-simulation-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Finish the current record during graceful shutdown; durable inbox
      # idempotency makes a replay safe if the process is forcibly terminated.
      immediate-stop: false
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SCHEDULER_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.xkeneljgytgrrcsrbbqv.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Railway (and most PaaS platforms) assign a dynamic port at runtime via $PORT;
  # the app must bind to it rather than a fixed port. Falls back to 8080 for local
  # dev / docker-compose where no PORT env var is injected.
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  kafka:
    producer:
      delivery-timeout: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}ms
      request-timeout: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:30000}ms
      retry-backoff: ${KAFKA_PRODUCER_RETRY_BACKOFF_MS:500}ms
      retries: ${KAFKA_PRODUCER_RETRIES:2147483647}
      parallel-requests: ${KAFKA_PRODUCER_PARALLEL_REQUESTS:5}
    consumer:
      retry-backoff: ${KAFKA_CONSUMER_RETRY_BACKOFF_MS:2000}ms
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
    outbox:
      poll-delay: ${KAFKA_OUTBOX_POLL_DELAY_MS:200}ms
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      recovery-delay: ${KAFKA_OUTBOX_RECOVERY_DELAY_MS:30000}ms
      # Added to producer delivery-timeout before a PROCESSING lease is stale.
      recovery-safety-margin: ${KAFKA_OUTBOX_RECOVERY_SAFETY_MARGIN_MS:30000}ms
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:10}
      cleanup-cron: ${KAFKA_OUTBOX_CLEANUP_CRON:0 */10 * * * *}
      retention: ${KAFKA_OUTBOX_RETENTION_DAYS:2}d
      cleanup-batch-size: ${KAFKA_OUTBOX_CLEANUP_BATCH_SIZE:10000}
      retry:
        initial-delay: ${KAFKA_OUTBOX_RETRY_INITIAL_DELAY_MS:1000}ms
        max-delay: ${KAFKA_OUTBOX_RETRY_MAX_DELAY_MS:300000}ms
        multiplier: ${KAFKA_OUTBOX_RETRY_MULTIPLIER:2.0}
        jitter-ratio: ${KAFKA_OUTBOX_RETRY_JITTER_RATIO:0.2}
    inbox:
      # Keep this longer than the maximum Kafka replay/redelivery horizon.
      retention: ${KAFKA_INBOX_RETENTION_DAYS:14}d
      cleanup-batch-size: ${KAFKA_INBOX_CLEANUP_BATCH_SIZE:10000}
      cleanup-cron: ${KAFKA_INBOX_CLEANUP_CRON:0 15 * * * *}
    notifications:
      dlt:
        topic-name: ${KAFKA_NOTIFICATIONS_DLT_TOPIC_NAME:notifications.DLT}
        consumer:
          group-id: ${KAFKA_NOTIFICATIONS_DLT_GROUP_ID:notification-dlt-monitor}
          concurrency: ${KAFKA_NOTIFICATIONS_DLT_CONCURRENCY:1}
      topic:
        name: ${KAFKA_NOTIFICATION_TOPIC:notifications}
        partitions: ${KAFKA_NOTIFICATION_PARTITIONS:1}
        replicas: ${KAFKA_NOTIFICATION_REPLICAS:1}
      consumer:
        group-id: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:user-notification-listener}
        concurrency: ${KAFKA_NOTIFICATION_CONCURRENCY:1}
  observability:
    token: ${OBSERVABILITY_TOKEN:}
    loki:
      # Railway containers cannot mount another service's stdout. In production the
      # API ships its structured events directly to Loki over private networking.
      enabled: ${LOKI_ENABLED:false}
      push-url: ${LOKI_PUSH_URL:}
      service-name: ${LOKI_SERVICE_NAME:consulting-simulation-api}
      batch-size: ${LOKI_BATCH_SIZE:100}
      flush-interval-ms: ${LOKI_FLUSH_INTERVAL_MS:1000}
  async:
    outbox-completion:
      pool-size: ${OUTBOX_COMPLETION_POOL_SIZE:8}
      queue-capacity: ${OUTBOX_COMPLETION_QUEUE_CAPACITY:500}
      shutdown-timeout: ${OUTBOX_COMPLETION_SHUTDOWN_TIMEOUT:15s}
  # Comma-separated list of origins allowed to call the API (CORS) and open the
  # STOMP/WebSocket handshake (see WebSocketConfig). Defaults cover local dev
  # (Vite on 3000/5173); production deployments (Railway, IBM Cloud, ...) set
  # CORS_ALLOWED_ORIGINS to the deployed frontend's public URL(s) without a
  # code change or redeploy — same externalized-config pattern used throughout
  # this file for datasource/AI/COS/cache.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  admin:
    seed:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Platform Administrator}
  identity:
    email:
      public-web-url: ${APP_PUBLIC_WEB_URL:http://localhost:3000}
      verification-ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:1440}
      password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
      resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:60}
  email:
    provider: ${EMAIL_PROVIDER:resend}
    delivery:
      # Delivery is async-after-commit: account and credential state return
      # immediately, while a bounded worker handles SMTP/provider latency.
      max-attempts: ${EMAIL_DELIVERY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${EMAIL_DELIVERY_INITIAL_BACKOFF_MS:250}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      from: ${RESEND_FROM:IBM Consulting Simulation <no-reply@mail.ibm-simulator.com>}
      reply-to: ${RESEND_REPLY_TO:}
      connect-timeout-ms: ${RESEND_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${RESEND_READ_TIMEOUT_MS:8000}
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
      reply-to: ${SMTP_REPLY_TO:}
      connection-timeout-ms: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      timeout-ms: ${SMTP_TIMEOUT_MS:10000}
  watsonx:
    api-key: ${WATSONX_API_KEY:mock}
    project-id: ${WATSONX_PROJECT_ID:mock}
    base-url: ${WATSONX_BASE_URL:https://us-south.ml.cloud.ibm.com}
    model-id: ${WATSONX_MODEL_ID:ibm/granite-13b-chat-v2}
    embedding-model-id: ${WATSONX_EMBEDDING_MODEL_ID:ibm/slate-125m-english-rtrvr}
    mock-mode: ${WATSONX_MOCK_MODE:true}
  ai:
    # Governs the ENTIRE AiProviderRouter.complete() call, which may try more than
    # one provider in sequence on failure (Gemini -> watsonx -> OpenRouter, each with
    # its own shorter per-provider timeout below) — sized with headroom above the sum
    # of two provider attempts, not just one, so a single unhealthy provider doesn't
    # eat the whole budget and force a premature fallback ("Sorry, could you repeat
    # that?") while a healthy next candidate would have succeeded in time.
    timeout-ms: ${AI_TIMEOUT_MS:20000}
    # End-to-end budget for latency-sensitive dialogue, including provider failover
    # and any JSON repair attempt. The orchestration layer never exceeds this total.
    conversation-timeout-ms: ${AI_CONVERSATION_TIMEOUT_MS:4000}
    # Client Intelligence must feel immediate. If a provider cannot return a
    # schema-valid response inside this budget, the service returns deterministic
    # scenario-safe artefacts and records the fallback in ai_traces.
    client-intelligence-timeout-ms: ${AI_CLIENT_INTELLIGENCE_TIMEOUT_MS:1200}
    classification-timeout-ms: ${AI_CLASSIFICATION_TIMEOUT_MS:2500}
    # mock-mode=true -> MockAiGateway (deterministic, no external calls).
    # mock-mode=false -> AiProviderRouter takes over as the AiModelGateway bean and
    # fans out to whichever real providers below are configured (see AiProviderRouter
    # javadoc + docs/architecture/AI_ORCHESTRATION.md for the full design).
    mock-mode: ${AI_MOCK_MODE:false}
    parallel:
      # Every available candidate is started concurrently. Live tasks accept
      # the first schema-valid result; assessment waits for its preferred
      # reasoning candidate within the same bounded deadline.
      enabled: ${AI_PARALLEL_ENABLED:true}
      max-candidates: ${AI_PARALLEL_MAX_CANDIDATES:3}
    # Ordered, explicit candidate lists per task type — capability-based routing,
    # never random fallback (a persona's "voice" must not shift model-to-model
    # mid-conversation except on an actual provider outage). Provider ids must match
    # AiProvider.id() — currently: gemini-free, watsonx-granite, openrouter-free.
    routing:
      # Live, latency-sensitive: persona dialogue, outreach replies. Free/fast first.
      conversation: ${AI_ROUTE_CONVERSATION:gemini-free,watsonx-granite,openrouter-free}
      # Cheap structured-output judgements (intent/topic/quality signals).
      classification: ${AI_ROUTE_CLASSIFICATION:gemini-free,watsonx-granite,openrouter-free}
      client-intelligence: ${AI_ROUTE_CLIENT_INTELLIGENCE:gemini-free,watsonx-granite,openrouter-free}
      # End-of-engagement coaching narrative — latency-tolerant, reasoning matters most.
      # watsonx/Granite is first-choice here: its real job on this platform, not a
      # branding requirement (see docs/architecture/AI_ORCHESTRATION.md).
      assessment: ${AI_ROUTE_ASSESSMENT:watsonx-granite,gemini-free,openrouter-free}
      # Proposal scoring is deterministic. This task only produces coaching
      # narrative, so return the first schema-valid low-latency model response.
      proposal-review: ${AI_ROUTE_PROPOSAL_REVIEW:gemini-free,watsonx-granite,openrouter-free}
      evidence_extraction: ${AI_ROUTE_EVIDENCE_EXTRACTION:gemini-free,watsonx-granite,openrouter-free}
    # Circuit breaker (Resilience4j) — after failure-rate-threshold% of the last
    # sliding-window-size calls to a provider fail, its circuit opens for
    # wait-duration-seconds so subsequent requests skip straight to the next
    # candidate instead of waiting out a doomed call's full timeout.
    circuit-breaker:
      failure-rate-threshold: ${AI_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
      wait-duration-seconds: ${AI_CIRCUIT_WAIT_DURATION_SECONDS:60}
      sliding-window-size: ${AI_CIRCUIT_SLIDING_WINDOW_SIZE:10}
      minimum-calls: ${AI_CIRCUIT_MINIMUM_CALLS:5}
    providers:
      # IBM watsonx.ai — the platform's premium tier. Reuses app.watsonx.* connection
      # settings above (api-key/project-id/base-url/model-id); daily-quota is
      # effectively "unlimited" for routing purposes (a paid/allocated tier, not a
      # free-quota-constrained one) but still tracked for observability.
      watsonx:
        daily-quota: ${AI_WATSONX_DAILY_QUOTA:100000}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        model-id: ${GEMINI_MODEL_ID:gemini-2.5-flash}
        timeout-ms: ${GEMINI_TIMEOUT_MS:8000}
        daily-quota: ${AI_GEMINI_DAILY_QUOTA:1000}
      openrouter:
        api-key: ${OPENROUTER_API_KEY:}
        base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
        model-id: ${OPENROUTER_MODEL_ID:openai/gpt-oss-20b:free}
        timeout-ms: ${OPENROUTER_TIMEOUT_MS:12000}
        # OpenRouter's free plan is ~50 requests/day — deliberately last-priority
        # everywhere (emergency/dev fallback only), never the primary route.
        daily-quota: ${AI_OPENROUTER_DAILY_QUOTA:50}
  cos:
    endpoint: ${COS_ENDPOINT:https://s3.us-south.cloud-object-storage.appdomain.cloud}
    access-key: ${COS_ACCESS_KEY:mock}
    secret-key: ${COS_SECRET_KEY:mock}
    region: ${COS_REGION:us-south}
    bucket: ${COS_BUCKET:consulting-sim-transcripts}
    mock-mode: ${COS_MOCK_MODE:true}
  cache:
    # caffeine = JVM-local (default, no external dependency, fine for a single
    #            instance / local dev). upstash = distributed via the Upstash
    #            Redis REST API (see CacheConfig for the future IBM-Redis swap
    #            path — same @Cacheable call sites, just a different provider).
    provider: ${CACHE_PROVIDER:caffeine}
    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:600}
    persona-ttl-seconds: ${CACHE_PERSONA_TTL_SECONDS:1800}
    upstash:
      rest-url: ${UPSTASH_REDIS_REST_URL:}
      rest-token: ${UPSTASH_REDIS_REST_TOKEN:}

logging:
  level:
    com.ibm.consulting: DEBUG
    org.hibernate.SQL: DEBUG
