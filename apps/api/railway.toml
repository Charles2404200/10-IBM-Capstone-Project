[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT; Spring binds to it via server.port=${PORT:8080} in application.yml.
# healthcheckPath must return 2xx — Spring Actuator /actuator/health does so once the app
# is fully started, providing a meaningful readiness signal rather than just TCP-reachability.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
