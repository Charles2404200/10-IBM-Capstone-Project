[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT; Spring binds to it via server.port=${PORT:8080} in application.yml.
# Railway needs to know whether this container is alive. Dependency readiness
# remains visible at /actuator/health/readiness, but must not create a restart
# loop when a database or optional cache has a transient outage.
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
